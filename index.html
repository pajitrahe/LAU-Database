<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบงานแผนกสัตว์ใหญ่</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d6a56">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header (month picker + section tabs) → one working view at a time; forms in 12-col grid, reports as dense tables, dashboard as KPI strip + cards */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --sunk:#eef1ec; --ink:#16201b; --ink-2:#47534c; --muted:#76817a; --line:#dbe1da;
  --accent:#0d6a56; --accent-ink:#ffffff; --accent-soft:#e0eee8;
  --good:#157f3d; --bad:#b42318; --warn:#a85b06; --warn-soft:#fdf1e1; --bad-soft:#fbe7e5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#181e1b; --sunk:#141917; --ink:#e9eee9; --ink-2:#b6c0b9; --muted:#8b968f; --line:#2a332e;
  --accent:#43b796; --accent-ink:#0b1a15; --accent-soft:#1b3830; --good:#4cc27a; --bad:#f07466; --warn:#e3a14a; --warn-soft:#3a2a14; --bad-soft:#3d1c19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181e1b; --sunk:#141917; --ink:#e9eee9; --ink-2:#b6c0b9; --muted:#8b968f; --line:#2a332e;
  --accent:#43b796; --accent-ink:#0b1a15; --accent-soft:#1b3830; --good:#4cc27a; --bad:#f07466; --warn:#e3a14a; --warn-soft:#3a2a14; --bad-soft:#3d1c19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:none;margin:0 auto;padding:0 max(16px,min(2.5vw,40px),env(safe-area-inset-left,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .row1{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 0 4px}
.brand small{display:block;font-size:12px;color:var(--muted)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;line-height:1.25}
.picker{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.picker label{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;color:var(--ink-2);font:inherit;font-weight:500;cursor:pointer;border-radius:6px 6px 0 0}
.tabs button:hover{background:var(--sunk);color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px 0 60px;display:flex;flex-direction:column;gap:20px}
select,input,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:36px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.plain{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-h h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;text-wrap:balance}
.sec-h p{margin:0;font-size:13px;color:var(--muted)}
.sec-h .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:600}
.card .note,.note{font-size:12.5px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:900px){.c2,.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}}
@media (max-width:480px){.c2,.c3{grid-column:span 12}}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label,.fld>.lab{font-size:12.5px;color:var(--ink-2);font-weight:500}
.fld .hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;min-height:34px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .k{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:13px;color:var(--ink-2)}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);background:var(--sunk);font-size:12.5px;vertical-align:bottom}
thead th{border-left:1px solid var(--line)}
th.l,td.l{text-align:left}
td.wrap,th.wrap{white-space:normal}
tr.total td{font-weight:600;border-top:2px solid var(--ink-2);background:var(--sunk)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.flag td{background:var(--warn-soft)}
td .z{color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--accent-soft);color:var(--good)}
.notice{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--ink-2)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.sum-box{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-variant-numeric:tabular-nums;align-items:baseline}
.sum-box .big{font-family:var(--f-display);font-size:22px;font-weight:700}
.owner-card{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink-2);background:var(--sunk)}
.sugg{position:absolute;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;width:100%;top:100%;left:0;margin-top:2px}
.sugg div{padding:6px 10px;cursor:pointer;font-size:14px}
.sugg div:hover,.sugg div.on{background:var(--accent-soft)}
.sugg small{color:var(--muted);margin-left:6px}
.rel{position:relative}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .n{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{background:var(--sunk);border-radius:4px;height:12px;position:relative;overflow:hidden}
.hb .t b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.hb .v{font-family:var(--f-mono);font-size:12.5px;min-width:70px;text-align:right}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:13px}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rep-title{text-align:center;display:flex;flex-direction:column;gap:2px}
.rep-title b{font-family:var(--f-display);font-size:17px}
.rep-title span{color:var(--ink-2);font-size:14px}
.kv{display:grid;grid-template-columns:minmax(200px,1fr) auto auto;gap:4px 18px;font-size:14px;align-items:baseline}
.kv .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.kv .u{color:var(--muted);font-size:13px}
.kv .h{grid-column:1/-1;font-weight:600;margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:2px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dlg h3{margin:0;font-family:var(--f-display)}
.ocr-img{max-height:420px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--sunk);width:100%}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.thd{position:relative;display:inline-flex;align-items:center;width:100%}.thd>input[type=text]{width:100%;min-width:132px;padding-right:34px}select.need{border-color:var(--warn,#c47a00);background:color-mix(in srgb,#f0a020 10%,transparent)}.thd-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted,#666);cursor:pointer;padding:4px;line-height:0}.thd-btn:hover{color:var(--accent,#0d6a56)}.thd-native{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
tr.auto td{background:color-mix(in srgb,var(--accent,#0d6a56) 5%,transparent)}
</style>

<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand"><small>แผนกบริการด้านสัตว์ใหญ่ · รพ.สัตว์ มก. หนองโพ</small><h1>ระบบงานแผนกสัตว์ใหญ่</h1></div>
      <div class="picker">
        <label for="mSel">เดือน</label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== local.js : on-device database (IndexedDB) for the PWA build =====
   Gives the app the same small API it uses with the cloud store (collection/doc, where, get, onSnapshot, set, delete),
   so the screens and calculations are identical. Every document lives in one IndexedDB object store keyed by its path. */
(() => {
  const DB_NAME = 'lam-local', STORE = 'docs', META = 'meta';
  let idb = null; const cache = new Map(); // path -> data
  const listeners = new Set();
  const ready = new Promise((resolve, reject) => {
    const rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); if (!d.objectStoreNames.contains(META)) d.createObjectStore(META); };
    rq.onerror = () => reject(rq.error);
    rq.onsuccess = () => {
      idb = rq.result;
      const tx = idb.transaction(STORE, 'readonly'); const st = tx.objectStore(STORE);
      const cur = st.openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c) { cache.set(c.key, c.value); c.continue(); } else resolve(); };
      cur.onerror = () => reject(cur.error);
    };
  });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const clone = o => JSON.parse(JSON.stringify(o));
  const idbPut = (key, val) => new Promise((res, rej) => { const tx = idb.transaction(STORE, 'readwrite'); val === undefined ? tx.objectStore(STORE).delete(key) : tx.objectStore(STORE).put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  const metaGet = key => new Promise(res => { const tx = idb.transaction(META, 'readonly'); const r = tx.objectStore(META).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
  const metaSet = (key, val) => new Promise(res => { const tx = idb.transaction(META, 'readwrite'); tx.objectStore(META).put(val, key); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  let notifyT = null; let changed = new Set();
  function notify(coll) { changed.add(coll); clearTimeout(notifyT); notifyT = setTimeout(() => { const c = changed; changed = new Set(); listeners.forEach(l => { if (c.has(l.coll)) l.fire(); }); }, 0); }
  const snapDoc = (path) => { const d = cache.get(path); const id = path.split('/').pop(); return { id, exists: d !== undefined, data: () => d === undefined ? undefined : clone(d), metadata: { fromCache: false, hasPendingWrites: false } }; };
  function docRef(path) {
    const coll = path.split('/').slice(0, -1).join('/');
    return {
      id: path.split('/').pop(), path,
      async get() { await ready; return snapDoc(path); },
      async set(data) { await ready; const v = clone(data); cache.set(path, v); await idbPut(path, v); notify(coll); window.dispatchEvent(new CustomEvent('lam-local-write')); },
      async update(data) { await ready; const cur = cache.get(path); if (!cur) throw { code: 'invalid_argument', message: 'missing' }; const v = { ...cur, ...clone(data) }; cache.set(path, v); await idbPut(path, v); notify(coll); window.dispatchEvent(new CustomEvent('lam-local-write')); },
      async delete() { await ready; cache.delete(path); await idbPut(path, undefined); notify(coll); window.dispatchEvent(new CustomEvent('lam-local-write')); },
      onSnapshot(next) { const l = { coll, fire: () => next(snapDoc(path)) }; listeners.add(l); ready.then(() => l.fire()); return () => listeners.delete(l); },
    };
  }
  function query(coll, filters = [], lim = 0) {
    const ops = { '==': (a, b) => a === b, '!=': (a, b) => a !== b, '<': (a, b) => a < b, '<=': (a, b) => a <= b, '>': (a, b) => a > b, '>=': (a, b) => a >= b, 'in': (a, b) => b.includes(a) };
    const run = () => {
      const pre = coll + '/'; const docs = [];
      for (const [k, v] of cache) { if (!k.startsWith(pre) || k.slice(pre.length).includes('/')) continue; if (filters.every(([f, op, val]) => ops[op](v[f], val))) docs.push({ id: k.slice(pre.length), exists: true, data: () => clone(v), metadata: { fromCache: false, hasPendingWrites: false } }); }
      docs.sort((a, b) => a.id < b.id ? -1 : 1);
      const out = lim ? docs.slice(0, lim) : docs;
      return { docs: out, size: out.length, empty: !out.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      where(f, op, v) { return query(coll, [...filters, [f, op, v]], lim); },
      limit(n) { return query(coll, filters, n); },
      orderBy() { return this; },
      async get() { await ready; return run(); },
      onSnapshot(next) { const l = { coll, fire: () => next(run()) }; listeners.add(l); ready.then(() => l.fire()); return () => listeners.delete(l); },
      doc(id) { return docRef(coll + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      async add(data) { const r = this.doc(); await r.set(data); return r; },
    };
  }
  const localDb = { doc: p => docRef(p), collection: c => query(c) };
  const localDownloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { status: 'saved' };
    },
  };
  const localUser = { can: async () => true, canEdit: () => true, isOwner: () => true, id: async () => 'local', me: async () => ({ id: 'local' }) };
  window.LAM_LOCAL = { ready, all: async () => { await ready; return [...cache.entries()]; }, replaceAll: async (entries) => {
      await ready; await new Promise((res, rej) => { const tx = idb.transaction(STORE, 'readwrite'); const st = tx.objectStore(STORE); st.clear(); entries.forEach(([k, v]) => st.put(v, k)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
      cache.clear(); entries.forEach(([k, v]) => cache.set(k, v)); const colls = new Set(entries.map(([k]) => k.split('/').slice(0, -1).join('/'))); listeners.forEach(l => l.fire()); colls.forEach(() => {}); },
    metaGet, metaSet, count: () => cache.size };
  window.claude = { use: async name => { if (name === 'db') { await ready; return localDb; } if (name === 'downloads') return localDownloads; if (name === 'user') return localUser; return null; } };
})();
</script>
<script>
/* ===== core.js : codes, import parser, report calculations (pure, no DOM) ===== */
const CORE = (() => {
  const VET_DEFAULT = [

    /* --- 5. นับซ้ำ --- */
    const dup = key => {
      const a = A[key];
      const rows = a.rows.map(o => {

function hbars(items, colorVar, money) {
  const max = Math.max(1, ...items.map(x => x[1]));
  return `<div class="hbars">${items.map(([k, v, c]) => `<div class="hb"><span class="n" title="${esc(k)}">${esc(k)}</span><span class="t"><b style="width:${(v / max * 100).toFixed(1)}%;background:var(${c || colorVar || '--accent'})"></b></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`;
}
function barChart(labels, series, opts = {}) {
  // series: [{name,color,values}] stacked
  const W = opts.w || Math.max(900, Math.min(2600, (window.innerWidth || 1300) - 140)), H = opts.h || 220, pl = 52, pb = 24, pt = 8, pr = 8;
  const tot = labels.map((_, i) => series.reduce((a, s2) => a + (s2.values[i] || 0), 0));
  let max = Math.max(1, ...tot, ...(opts.line ? opts.line.values : [0])); const step = niceStep(max); max = Math.ceil(max / step) * step;
  const bw = (W - pl - pr) / labels.length;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmtShort(v)}</text>`;
  let bars = '';
  labels.forEach((lab, i) => {
    let acc = 0; series.forEach(s2 => { const v = s2.values[i] || 0; if (!v) return; const y0 = y(acc), y1 = y(acc + v); bars += `<rect x="${pl + i * bw + bw * .15}" width="${bw * .7}" y="${y1}" height="${Math.max(0, y0 - y1)}" fill="var(${s2.color})" rx="2"><title>${esc(lab)} · ${esc(s2.name)}: ${fmt(v)}</title></rect>`; acc += v; });
    if (labels.length <= 14 || i % Math.ceil(labels.length / 16) === 0) bars += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  if (opts.line) { const pts = opts.line.values.map((v, i) => v == null ? null : `${pl + i * bw + bw / 2},${y(v)}`).filter(Boolean).join(' '); bars += `<polyline points="${pts}" fill="none" stroke="var(${opts.line.color})" stroke-width="2.5"/>` + opts.line.values.map((v, i) => v == null ? '' : `<circle cx="${pl + i * bw + bw / 2}" cy="${y(v || 0)}" r="3.5" fill="var(${opts.line.color})"><title>${esc(labels[i])} · ${esc(opts.line.name)}: ${fmt(v)}</title></circle>`).join(''); }
  const leg = [...series.map(s2 => [s2.name, s2.color]), ...(opts.line ? [[opts.line.name, opts.line.color]] : [])];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg></div>${leg.length > 1 ? `<div class="legend">${leg.map(([a, c]) => `<span><i style="background:var(${c})"></i>${esc(a)}</span>`).join('')}</div>` : ''}`;
}
function niceStep(max) { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function fmtShort(v) { if (v >= 1e6) return fmt(v / 1e6, 1) + 'M'; if (v >= 1e3) return fmt(v / 1e3, v % 1000 ? 1 : 0) + 'k'; return fmt(v); }

function setField(f, v, rerender = true) {
  const r = draft();
  if (v === '' || v == null) delete r[f]; else r[f] = C.NUMERIC_OPD.has(f) || f === 'pppOv' ? (isNaN(+v) ? v : +v) : v;
  if (f === 'P' && r.co) { r.co = r.co.filter(x => x !== v); if (!r.co.length) delete r.co; }
  if (f === 'D' && v) { r.H = C.isWeekend(v) ? 2 : (n(r.H) === 2 ? 1 : r.H); }
  if (f === 'I') { if (+v === 2) { r.AK = r.AK || 1; if (n(r.AJ) === 1) delete r.AJ; r.AZ = 3; } else { r.AJ = r.AJ || 1; if (n(r.AK) === 1) delete r.AK; if (n(r.AZ) === 3) delete r.AZ; } }
  if (f === 'AX') { const d = dxRef(v); if (d && d[2] && !['K', 'L', 'M', 'N'].some(k => has(r[k]))) r.K = d[2]; }
  if (f === 'AX2' || f === 'AX3') { const d = dxRef(v); if (d && d[2] && !['K', 'L', 'M', 'N'].some(k => n(r[k]) === d[2])) { const k = ['L', 'M', 'N'].find(k => !has(r[k])); if (k) r[k] = d[2]; } }
  if (f === 'AX' && s(v).startsWith('เยี่ยมฟาร์ม')) { r.AY = 4; if (!has(r.K)) r.K = 15; if (n(r.AJ) === 1) delete r.AJ; }
  if (f === 'B') { const o = S.ownerMap.get(s(v)); if (o) { r.E = o.p; r.F = o.k; r.J = C.ownerSpecies(o)[0] || o.s; if (o.d && o.d.slice(0, 7) === S.month) r.AW = 2; } else { delete r.E; delete r.F; delete r.J; } }
  if (rerender) scheduleRender();
}

async function farmSave(key, k, v) {
  const e = key.startsWith('o:') ? report().farmList.find(x => !x._id && (x.opdId || '') === key.slice(2)) : report().farmList.find(x => x._id === key);
  if (!e) return; const id = e._id || uid();
  const base = e._id ? { ...S.farm.find(x => x._id === e._id) } : { m: S.month, opdId: e.opdId, AF: e.AF, AI: null, AJ: null, area: e.area, seq: Date.now() };
  if (k === 'AF' || k === 'AM' || k === 'area') base[k] = v; else base[k] = v === '' ? null : +v;
  if (e._row && !base.opdId && e.opdId) base.opdId = e.opdId;
  try { await put('farm', id, base);
    if (k === 'area' && s(e.AF)) { const fa = { ...((S.config && S.config.farmArea) || {}), [s(e.AF).replace(/\s+/g, ' ')]: v }; await put('config', 'main', { ...(S.config || {}), farmArea: fa }); if (S.db) S.config = { ...S.config, farmArea: fa }; }
  } catch (err) { toast('บันทึกไม่สำเร็จ'); }
}

async function saveMs(mut) { const ms = JSON.parse(JSON.stringify(S.mset || {})); mut(ms); try { await put('months', S.month, ms); if (S.db) { S.mset = ms; render(); } } catch (e) { toast('บันทึกไม่สำเร็จ: ' + (e.message || e.code)); } }

document.addEventListener('change', async e => {
  const t = e.target, v = t.value;
  if (t.dataset.surg) { const parts = t.dataset.surg.split(':'); const k = parts.pop(); const key = parts.join(':');
    if (key.startsWith('a:')) { const x = report().surgList.find(e => e.auto && (e.opdId || e.opd) === key.slice(2)); if (!x) return; await saveMs(ms => { ms.surg = ms.surg || []; ms.surg.push({ opdId: x.opdId, date: x.date, opd: x.opd, fee: x.fee, surgeon: x.surgeon, assist: x.assist, anesth: x.anesth, [k]: v }); }); }
    else await saveMs(ms => { ms.surg = ms.surg || []; ms.surg[+key][k] = k === 'fee' ? (v === '' ? null : +v) : v; }); }
  else if (t.dataset.adj) { const [vk, k] = t.dataset.adj.split(':'); await saveMs(ms => { ms.pppAdj = ms.pppAdj || {}; ms.pppAdj[vk] = ms.pppAdj[vk] || {}; ms.pppAdj[vk][k] = v === '' ? null : +v; }); }
  else if (t.dataset.cost) { const [i, k] = t.dataset.cost.split(':'); await saveMs(ms => { ms.costs[+i][k] = k === 'amount' ? (v === '' ? null : +v) : v; }); }
  else if (t.dataset.fuel) { const [d, k] = t.dataset.fuel.split(':'); await saveMs(ms => { ms.fuel = ms.fuel || {}; ms.fuel[d] = ms.fuel[d] || {}; if (v === '') delete ms.fuel[d][k]; else ms.fuel[d][k] = +v; if (!Object.keys(ms.fuel[d]).length) delete ms.fuel[d]; }); }
  else if (t.dataset.prod) { await saveMs(ms => { ms.prod = ms.prod || {}; ms.prod[t.dataset.prod] = v === '' ? null : +v; }); }
});

async function saveOwner(o, prevName) {
  const items = { ...S.chunks };
  let cid = null;
  if (prevName) { const old = S.ownerMap.get(prevName); if (old) cid = old._c; }
  if (!prevName && S.ownerMap.has(o.n)) { toast('มีชื่อนี้ในทะเบียนแล้ว'); return false; }
  if (cid) { const arr = items[cid].map(x => x.n === prevName ? o : x); await put('owners', cid, { items: arr }); }
  else {
    const ids = Object.keys(items).sort(); let last = ids[ids.length - 1];
    if (!last || items[last].length >= 450) { last = 'c' + String(ids.length).padStart(3, '0'); items[last] = []; }
    await put('owners', last, { items: [...items[last], o] });
  }
  return true;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'ownForm') return; e.preventDefault();
  const sp = C.ownerSpecies(ownEdit).length ? C.ownerSpecies(ownEdit) : [1];
  const pv = C.fixProvince($('#o_pv').value) || s($('#o_pv').value);
  const o = { n: s($('#o_n').value), p: +$('#o_p').value, pv, ap: s($('#o_ap').value).replace(/^อ\.|^อำเภอ/, ''), tb: s($('#o_tb').value).replace(/^ต\.|^ตำบล/, ''), k: +$('#o_k').value, s: sp[0], ss: sp, t: s($('#o_t').value), a: s($('#o_a').value), z: s($('#o_z').value), d: $('#o_d').value };
  if (!o.n) { toast('กรอกชื่อ'); return; }
  try { const ok = await saveOwner(o, ownEdit && ownEdit._c ? ownEdit.n : null); if (!ok) return; toast('บันทึกทะเบียนแล้ว'); const back = ownEdit && ownEdit._back; ownEdit = null; if (back) { S.view = 'entry'; setTimeout(() => setField('B', o.n), 300); } render(); } catch (err) { toast('บันทึกไม่สำเร็จ: ' + (err.message || err.code)); }
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-osp]'); if (c && ownEdit) { syncOwnForm(); const k = +c.dataset.osp; let a = C.ownerSpecies(ownEdit).slice(); if (a.includes(k)) a = a.filter(x => x !== k); else if (a.length < 3) a.push(k); else { toast('เลือกได้ไม่เกิน 3 ชนิด'); return; } ownEdit.ss = a; ownEdit.s = a[0]; render(); return; }
  const f = e.target.closest('[data-ownf]'); if (f) { ownFilter = f.dataset.ownf; render(); }
});
function syncOwnForm() { if (!ownEdit || !$('#ownForm')) return; ['n', 't', 'd', 'a', 'tb', 'ap', 'pv', 'z'].forEach(k => { const el = $('#o_' + k); if (el) ownEdit[k] = el.value; }); ownEdit.p = +$('#o_p').value; ownEdit.k = +$('#o_k').value; }
document.addEventListener('change', e => { if (e.target.id === 'o_pv' && ownEdit) { syncOwnForm(); const pv = C.fixProvince(e.target.value); if (pv) { ownEdit.pv = pv; ownEdit.p = C.GROUP_OF(pv); } render(); } });
async function splitAllAddresses() {
  const chunks = {}; let changed = 0;
  Object.entries(S.chunks).forEach(([id, items]) => { chunks[id] = items.map(o => { if (o.pv !== undefined) { if (o.pv && C.GROUP_OF(o.pv) !== o.p) { changed++; return { ...o, p: C.GROUP_OF(o.pv) }; } return o; } const full = [o.a, o.tb && 'ต.' + o.tb, o.ap && 'อ.' + o.ap].filter(Boolean).join(' '); const ad = C.parseAddress(full, o.p); changed++; return { ...o, p: ad.pv ? C.GROUP_OF(ad.pv) : o.p, pv: ad.pv, ap: ad.ap, tb: ad.tb, a: ad.a, z: o.z || ad.z, ss: C.ownerSpecies(o).length ? C.ownerSpecies(o) : [o.s || 1] }; }); });
  for (const [id, items] of Object.entries(chunks)) await put('owners', id, { items });
  toast(`ปรับข้อมูลจังหวัดแล้ว ${fmt(changed)} ราย`, 4000);
}

async function readXlsx(file) {
  if (typeof XLSX === 'undefined') throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const book = {}; wb.SheetNames.forEach(nm => { book[nm] = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, defval: null }); });
  return book;
}
async function onImportFiles(files) {

  }
  list.sort((a, b) => (a.month || '').localeCompare(b.month || ''));
  // which months already hold data
  S.loadedMonths = new Set();

async function writeDxList(items, meta) {
  const oldIds = S.db ? (await S.db.collection('dxref').get()).docs.map(d => d.id) : Object.keys(MEM.dxref); const keep = new Set();
  for (let i = 0; i * 150 < items.length; i++) { const id = 'c' + String(i).padStart(3, '0'); keep.add(id); await put('dxref', id, { items: items.slice(i * 150, i * 150 + 150).map(d => ({ en: d[0], th: d[1], card: d[2], sys: d[3], al: d[4] || [] })) }); }
  for (const id of oldIds) if (id !== 'meta' && !keep.has(id)) await del('dxref', id);
  if (meta) await put('dxref', 'meta', meta); else if (oldIds.includes('meta')) await del('dxref', 'meta');
}

async function backfillDebt() {

const BACKUP_COLLS = ['owners', 'opd', 'hoof', 'farm', 'tm', 'months', 'config', 'invoices', 'dxref'];
async function collectAll() {
  if (window.LAM_LOCAL) return await LAM_LOCAL.all();
  const out = []; for (const c of BACKUP_COLLS) { const snap = await S.db.collection(c).get(); snap.docs.forEach(d => out.push([c + '/' + d.id, d.data()])); } return out;
}
const backupName = () => 'สำรองข้อมูลแผนกสัตว์ใหญ่ ' + todayISO() + '.json';
async function makeBackup() { const docs = await collectAll(); return JSON.stringify({ app: 'lam', version: 1, at: new Date().toISOString(), count: docs.length, docs }); }
async function downloadBackup() {
  if (!S.db) { toast('ยังไม่ได้เชื่อมฐานข้อมูล'); return; }
  toast('กำลังเตรียมไฟล์สำรอง…'); const txt = await makeBackup();
  let dl = null; try { dl = await claude.use('downloads'); } catch (e) {}
  if (!dl) { toast('ดาวน์โหลดไม่ได้ในหน้านี้'); return; }
  try { await dl.save({ filename: backupName(), data: new Blob([txt], { type: 'application/json' }) }); if (window.LAM_LOCAL) { await LAM_LOCAL.metaSet('lastBackup', new Date().toISOString()); backupBadge(); } toast('ดาวน์โหลดไฟล์สำรองแล้ว'); } catch (e) { if (e.code !== 'declined') toast('ดาวน์โหลดไม่สำเร็จ'); }
}
async function restoreBackup(file) {
  let obj; try { obj = JSON.parse(await file.text()); } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ'); return; }
  if (!obj || obj.app !== 'lam' || !Array.isArray(obj.docs)) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ'); return; }
  S._restoreObj = obj;
  const n0 = window.LAM_LOCAL ? LAM_LOCAL.count() : 0;
  dlg(`<h3>กู้คืนข้อมูลจากไฟล์สำรอง</h3><p>ไฟล์สำรองวันที่ <b>${esc(new Date(obj.at).toLocaleString('th-TH'))}</b> มี ${fmt(obj.docs.length)} รายการ</p><div class="notice warn">ข้อมูลในเครื่องนี้ตอนนี้ (${fmt(n0)} รายการ) จะถูกแทนที่ทั้งหมด ถ้าไม่แน่ใจ ให้ดาวน์โหลดไฟล์สำรองของข้อมูลปัจจุบันเก็บไว้ก่อน</div><div class="row end"><button class="btn plain" data-act="dlgclose">ยกเลิก</button><button class="btn danger" data-act="restoreok">แทนที่ด้วยไฟล์สำรอง</button></div>`);
}
document.addEventListener('click', async e => { const b = e.target.closest('[data-act="restoreok"]'); if (!b || !S._restoreObj) return; const obj = S._restoreObj; S._restoreObj = null; dlgClose(); await LAM_LOCAL.replaceAll(obj.docs); toast('กู้คืนข้อมูลเรียบร้อย', 4000); subscribeMonth(); render(); });
async function backupBadge() {
  if (!window.LAM_LOCAL) return;
  const last = await LAM_LOCAL.metaGet('lastBackup'); const dir = await LAM_LOCAL.metaGet('backupDir');
  const days = last ? Math.floor((Date.now() - new Date(last)) / 864e5) : null;
  const txt = last ? `สำรองล่าสุด ${new Date(last).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })}` : 'ยังไม่เคยสำรองข้อมูล';
  setSync('ในเครื่องนี้ · ' + txt, days == null || days > 7 ? 'warn' : 'good');
  const el = document.getElementById('backupInfo'); if (el) el.textContent = txt + (dir ? ` · สำรองอัตโนมัติไปที่โฟลเดอร์ "${dir.name}"` : '');
}
let autoT = null;
async function autoBackup(interactive) {
  if (!window.LAM_LOCAL) return;
  const dir = await LAM_LOCAL.metaGet('backupDir'); if (!dir) return;
  try {
    let perm = await dir.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && interactive) perm = await dir.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { setSync('สำรองอัตโนมัติรออนุญาต: กดปุ่มที่แท็บนำเข้า/ส่งออก', 'warn'); return; }
    const fh = await dir.getFileHandle(backupName(), { create: true }); const w = await fh.createWritable(); await w.write(await makeBackup()); await w.close();
    await LAM_LOCAL.metaSet('lastBackup', new Date().toISOString()); backupBadge();
  } catch (e) { console.warn(e); }
}
window.addEventListener('lam-local-write', () => { clearTimeout(autoT); autoT = setTimeout(() => autoBackup(false), 60000); });
document.addEventListener('change', e => { if (e.target.id === 'restoreFile' && e.target.files[0]) { restoreBackup(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'backup') downloadBackup();
  if (b.dataset.act === 'backupdir') { try { const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'lam-backup' }); await LAM_LOCAL.metaSet('backupDir', dir); await autoBackup(true); toast('ตั้งโฟลเดอร์สำรองอัตโนมัติแล้ว'); } catch (err) { if (err.name !== 'AbortError') toast('ตั้งโฟลเดอร์ไม่สำเร็จ'); } }
});

/* ======================= boot ======================= */
buildMonths(); buildTabs(); render();
(async () => {
  let db = null;
  try { db = await claude.use('db'); } catch (e) {}
  if (!db) { S.mode = 'memory'; setSync('โหมดทดลอง: ข้อมูลไม่ถูกบันทึกถาวร', 'warn'); refreshMem(); return; }
  S.db = db; S.mode = 'db';
  db.collection('owners').onSnapshot(snap => { setOwners(snap.docs.map(d => ({ id: d.id, items: (d.data() || {}).items || [] }))); scheduleRender(); }, () => {});
  db.collection('invoices').onSnapshot(snap => { S.inv = snap.docs.map(d => ({ ...d.data(), _id: d.id })); scheduleRender(); }, () => {});
  db.collection('dxref').onSnapshot(snap => { applyDxDocs(snap.docs.map(d => ({ id: d.id, data: d.data() }))); scheduleRender(); }, () => {});
  db.doc('config/main').onSnapshot(d => { S.config = d.exists ? d.data() : {}; scheduleRender(); }, () => {});
  subscribeMonth();
  if (window.LAM_LOCAL) { backupBadge(); setTimeout(() => autoBackup(false), 5000); }
  try { const u = await claude.use('user'); if (u && u.can) { const w = await u.can('data.write'); if (w === false) { S.canWrite = false; setSync('ดูอย่างเดียว (ไม่มีสิทธิ์แก้ไข)', 'warn'); } } } catch (e) {}
})();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; const t = document.getElementById('toast'); if (t) { t.textContent = 'แอปอัปเดตเป็นรุ่นใหม่แล้ว'; t.hidden = false; setTimeout(() => t.hidden = true, 4000); } });
}
</script>
